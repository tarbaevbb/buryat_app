<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Буряад хэлэн">
  <!--
    Иконка приложения: стилизованная буква «Ү» (специфичная для бурятского
    алфавита) на зелёном фоне — цвет бренда совпадает с кнопками в интерфейсе.
    Векторный формат: не нужно генерировать несколько размеров.
  -->
  <rect width="64" height="64" rx="14" fill="#58cc02" />

  <!-- Буква Ү: две вертикальные линии и соединяющая дуга -->
  <path
    d="M18 16 v14 a14 14 0 0 0 28 0 V16"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Диакритика: отличает Ү от У -->
  <path d="M32 40 v8" fill="none" stroke="#ffc800" stroke-width="7" stroke-linecap="round" />
</svg>
