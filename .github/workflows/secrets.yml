name: Secret scan

# Ловит случайно закоммиченные секреты: токен бота, service-role ключ,
# пароли, приватные ключи. Проверяет всю историю, а не только последний
# коммит — секрет мог попасть в репозиторий раньше и остаться в истории.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история: иначе сканируется только последний коммит.
          fetch-depth: 0

      # Запускаем сам бинарь gitleaks, а не gitleaks-action: экшену нужен
      # платный GITLEAKS_LICENSE для организаций и он менее предсказуем
      # в поведении версий. Так мы фиксируем версию сами.
      - name: Установка gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Сканирование
        run: gitleaks detect --source . --redact --no-banner --verbose

      # Правила Supabase и Telegram: ключи бота и service-role не должны
      # попадать в репозиторий. Это дополняет gitleaks: у него в allowlist
      # есть примеры из документации, поэтому боевой токен, случайно
      # совпавший с примером, он пропустит.
      - name: Проверка специфичных для проекта секретов
        run: |
          echo "Проверяю, что в репозитории нет боевых ключей..."

          EXCLUDES=(
            ':(exclude).github/workflows/*'
            ':(exclude)*.md'
            ':(exclude)scripts/*'
            ':(exclude)**/*.test.ts'
            ':(exclude)**/*.test.tsx'
          )

          # Токен бота Telegram: <5-16 цифр>:<30+ символов>.
          # Верхнюю границу не завышаем: тело токена бывает 34-35 символов.
          if git grep -nE '[0-9]{5,16}:[A-Za-z0-9_-]{30,}' -- . "${EXCLUDES[@]}"; then
            echo "::error::Найден похожий на токен бота Telegram"
            exit 1
          fi

          # JWT с длинным payload — так выглядят anon и service-role ключи Supabase.
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.' -- . "${EXCLUDES[@]}"; then
            echo "::error::Найден похожий на JWT-ключ Supabase"
            exit 1
          fi

          # Файлы окружения не должны быть в индексе.
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::В репозиторий попал .env"
            exit 1
          fi

          echo "Секретов не найдено."
