name: CodeQL

# Статический анализ безопасности. Бесплатен для публичных репозиториев,
# результаты видны в Security → Code scanning alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Раз в неделю: новые правила появляются и без изменений в коде.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Анализ
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended добавляет правила за пределами набора по умолчанию.
          queries: security-extended

      - name: Анализ
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
