name: CI

# Проверки на каждый push в main, на любой pull request и вручную.
# Локально то же самое: npm run verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Валидация самих workflow. GitHub отклоняет некорректный файл молча:
  # запуск падает без job'ов и без логов, причину искать долго.
  # actionlint ловит такие ошибки (например, недоступный контекст
  # `secrets` в `environment.url`).
  # -------------------------------------------------------------------
  workflows:
    name: Валидация workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # -------------------------------------------------------------------
  # Линтер: ошибки стиля и потенциальные баги (react-hooks, a11y).
  # Идёт первым — он самый быстрый и даёт обратную связь раньше остальных.
  # -------------------------------------------------------------------
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  # -------------------------------------------------------------------
  # Типы и тесты: 170 тестов логики, курса, синхронизации и рендеринга.
  # -------------------------------------------------------------------
  test:
    name: Типы и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Проверка типов приложения
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Публикация отчёта о покрытии
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------
  # Сборка + контроль размера бандла.
  # -------------------------------------------------------------------
  build:
    name: Сборка и размер бандла
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Сборка
        run: npm run build
      - name: Лимиты размера
        run: node scripts/check-bundle-size.mjs
      - name: Сохранить артефакт сборки
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------------
  # Edge Function: Deno lint + проверка типов.
  # Тесты этой функции прогоняются в job `test` (через vitest).
  # -------------------------------------------------------------------
  deno:
    name: Edge Function (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Линтер
        working-directory: supabase/functions/telegram-auth
        run: deno lint
      - name: Форматирование
        working-directory: supabase/functions/telegram-auth
        run: deno fmt --check
      - name: Проверка типов
        working-directory: supabase/functions/telegram-auth
        run: deno check index.ts

  # -------------------------------------------------------------------
  # Проверка SQL-миграций: синтаксис, повторный прогон, RLS и функции.
  # Поднимаем Postgres и применяем миграцию дважды — она должна быть
  # идемпотентной, иначе `db push` сломается на уже настроенном проекте.
  # -------------------------------------------------------------------
  migrations:
    name: Миграции Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buryat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: buryat_test
    steps:
      - uses: actions/checkout@v7

      # Заглушки объектов Supabase (auth.users, auth.uid(), роли и права
      # по умолчанию) — те же, что использует локальный
      # `npm run check:migrations`. Отдельные файлы, чтобы CI и локальный
      # запуск проверяли ровно одно и то же.
      - name: Заглушки Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f scripts/sql/00-stubs.sql

      - name: Первый прогон миграций
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ применяю $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Повторный прогон (идемпотентность)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ повторяю $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Схема, RLS и права
        run: psql -v ON_ERROR_STOP=1 -q -f scripts/sql/10-schema.sql

      - name: Поведение RPC
        run: psql -v ON_ERROR_STOP=1 -q -f scripts/sql/20-behaviour.sql

      # Проверки защиты: каждая попытка ниже раньше завершалась успешно
      # и позволяла накрутить прогресс или испортить данные другому игроку.
      - name: Защита от накрутки
        run: psql -v ON_ERROR_STOP=1 -q -f scripts/sql/30-security.sql

  # -------------------------------------------------------------------
  # Итоговый job: один обязательный статус для branch protection.
  # -------------------------------------------------------------------
  ci-ok:
    name: CI пройден
    if: always()
    needs: [workflows, lint, test, build, deno, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Проверить результаты всех job
        run: |
          results=(
            "workflows=${{ needs.workflows.result }}"
            "lint=${{ needs.lint.result }}"
            "test=${{ needs.test.result }}"
            "build=${{ needs.build.result }}"
            "deno=${{ needs.deno.result }}"
            "migrations=${{ needs.migrations.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            echo "  $r"
            case "$r" in *success*) ;; *) failed=1 ;; esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "Часть проверок не прошла."
            exit 1
          fi
          echo "Все проверки прошли."
