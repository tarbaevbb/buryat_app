name: Deploy to GitHub Pages

# Публикация фронтенда на GitHub Pages.
# Запускается после успешного CI, чтобы на прод не попал битый код.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Проверки повторяем здесь: деплой не должен зависеть от того,
      # успел ли завершиться отдельный workflow CI.
      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      # Ключи Supabase берём из секретов репозитория.
      # Без них приложение соберётся в локальном режиме (прогресс
      # в localStorage) — это рабочий сценарий, а не ошибка.
      - name: Сборка
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Лимиты размера бандла
        run: node scripts/check-bundle-size.mjs

      # Проверяем, что облако действительно включилось в сборке.
      # Иначе легко выкатить «локальный» билд и не заметить этого.
      - name: Проверка режима сборки
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            if grep -q "supabase.co" dist/assets/*.js; then
              echo "Облачный режим включён в сборке."
            else
              echo "::error::Секреты заданы, но URL Supabase не попал в бандл"
              exit 1
            fi
          else
            echo "Секреты Supabase не заданы — сборка в локальном режиме."
          fi

      - name: Настройка Pages
        uses: actions/configure-pages@v6

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Деплой на Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Итог
        run: |
          {
            echo "### Опубликовано"
            echo ""
            echo "URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
