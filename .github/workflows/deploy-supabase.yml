name: Deploy Supabase

# Раскатывает миграции и Edge Function при пуше в main.
#
# Требуемые секреты (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — личный токен для CLI (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    — ref проекта из URL (https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   — пароль базы, заданный при создании проекта
#
# Если секреты не заданы, шаги пропускаются — workflow не падает,
# чтобы деплой фронтенда на Pages не зависел от настройки облака.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Сначала проверяем всё на локальном Postgres: миграция должна
  # применяться и быть идемпотентной. То же самое делает job
  # `migrations` в ci.yml, но здесь это защита от деплоя битой схемы.
  # -------------------------------------------------------------------
  verify:
    name: Проверка миграций
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buryat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Заглушки схемы auth
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d buryat_test -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          do $$
          declare r text;
          begin
            foreach r in array array['anon', 'authenticated', 'service_role'] loop
              if not exists (select 1 from pg_roles where rolname = r) then
                execute format('create role %I', r);
              end if;
            end loop;
          end $$;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text unique
          );
          create or replace function auth.uid()
          returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          SQL

      - name: Применить миграции дважды
        env:
          PGPASSWORD: postgres
        run: |
          for run in 1 2; do
            for f in supabase/migrations/*.sql; do
              echo "→ прогон $run: $f"
              psql -h localhost -U postgres -d buryat_test -v ON_ERROR_STOP=1 -f "$f" > /dev/null
            done
          done
          echo "Миграции применяются и идемпотентны."

  # -------------------------------------------------------------------
  # Деплой: миграции в базу проекта, затем Edge Function.
  # -------------------------------------------------------------------
  deploy:
    name: Публикация
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    environment:
      name: supabase
      url: https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Проверить наличие секретов
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Секреты Supabase не заданы — деплой пропущен."
            echo "Нужны: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Связать проект
        if: steps.check.outputs.skip == 'false'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Показать ожидающие миграции
        if: steps.check.outputs.skip == 'false'
        run: supabase migration list --linked

      - name: Применить миграции
        if: steps.check.outputs.skip == 'false'
        run: supabase db push --linked --include-all

      # Функция вызывается до авторизации, поэтому verify_jwt = false
      # (задано в supabase/config.toml и подтверждено флагом).
      - name: Задеплоить Edge Function
        if: steps.check.outputs.skip == 'false'
        run: supabase functions deploy telegram-auth --no-verify-jwt

      - name: Итог
        if: steps.check.outputs.skip == 'false'
        run: |
          {
            echo "### Supabase обновлён"
            echo ""
            echo "- Проект: \`$SUPABASE_PROJECT_ID\`"
            echo "- Миграции: применены"
            echo "- Функция: \`telegram-auth\` задеплоена"
          } >> "$GITHUB_STEP_SUMMARY"
